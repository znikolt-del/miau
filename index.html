<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Día de la Primavera! 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at bottom, #1e293b, #0f172a);
      height: 100vh;
      user-select: none;
    }

    /* PANTALLA DE BIENVENIDA (ELEGANTE) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem 2rem;
      border-radius: 24px;
      text-align: center;
      max-width: 450px;
      margin: 0 1rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(236, 72, 153, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transform: translateY(0);
      animation: float 4s ease-in-out infinite;
    }

    .flower-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
    }

    .envelope-card h1 {
      font-family: 'Great Vibes', cursive;
      color: #be185d;
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    .envelope-card p {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* BOTONES ESTILIZADOS */
    button {
      background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      color: white;
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 30px rgba(244, 63, 94, 0.6);
    }

    /* CANVAS DE JARDÍN */
    #garden-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* INTERFAZ DE USUARIO */
    .ui-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
      pointer-events: none;
    }

    .message-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      padding: 1.8rem 2.5rem;
      border-radius: 20px;
      text-align: center;
      max-width: 600px;
      margin: 0 1rem;
      pointer-events: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .message-card h1 {
      font-family: 'Great Vibes', cursive;
      color: #be185d;
      font-size: 3rem;
      margin-bottom: 0.3rem;
      font-weight: 400;
    }

    .message-card p {
      color: #334155;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    #edit-btn {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.85rem;
      padding: 0.4rem 1.2rem;
      box-shadow: none;
      border: 1px solid #cbd5e1;
    }

    #edit-btn:hover {
      background: #e2e8f0;
    }

    .action-buttons {
      margin-top: 1.2rem;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.9);
      color: #1e293b;
      padding: 0.7rem 1.4rem;
      border-radius: 30px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    /* MODAL DE EDICIÓN */
    .modal-hidden {
      display: none !important;
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: white;
      padding: 2.2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }

    .modal-card h2 {
      color: #1e293b;
      font-size: 1.4rem;
    }

    .modal-card input, .modal-card textarea {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    #cancel-btn {
      background: #94a3b8;
      box-shadow: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <!-- ELEMENTO DE AUDIO MP3 REAL -->
  <audio id="bg-music" loop preload="auto">
    <!-- Canción suave de piano y orquesta alojada en CDN confiable -->
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-love-111666.mp3" type="audio/mpeg">
  </audio>

  <!-- PANTALLA DE BIENVENIDA -->
  <div id="intro-overlay" class="overlay">
    <div class="envelope-card">
      <div class="flower-icon">🌸</div>
      <h1>Un regalo especial para ti</h1>
      <p>Abre esta sorpresa para hacer florecer un jardín mágico con música y mariposas.</p>
      <button id="start-btn">✨ Abrir Sorpresa ✨</button>
    </div>
  </div>

  <!-- JARDÍN INTERACTIVO -->
  <div id="main-content">
    <canvas id="garden-canvas"></canvas>

    <div class="ui-container">
      <div class="message-card">
        <h1 id="title-text">¡Feliz Día de la Primavera! 🌷</h1>
        <p id="message-text">Que este nuevo ciclo florezca lleno de alegría, amor, luz y colores para tu vida.</p>
        <button id="edit-btn">✏️ Personalizar Mensaje</button>
      </div>

      <div class="action-buttons">
        <button id="music-btn" class="icon-btn">🎵 Música On</button>
        <button id="petals-btn" class="icon-btn">🌸 Lluvia de Pétalos</button>
        <button id="clear-btn" class="icon-btn">🔄 Reiniciar Jardín</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE EDICIÓN -->
  <div id="modal-overlay" class="modal-hidden">
    <div class="modal-card">
      <h2>Escribe tu Dedicatoria</h2>
      <input type="text" id="input-title" placeholder="Título (Ej: ¡Feliz Día mi Amor!)">
      <textarea id="input-message" rows="4" placeholder="Escribe tu mensaje personalizado aquí..."></textarea>
      <div class="modal-actions">
        <button id="save-btn">Guardar</button>
        <button id="cancel-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('garden-canvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bg-music');

    let flowers = [];
    let petals = [];
    let butterflies = [];
    let sparkles = [];
    let isPlayingMusic = false;
    let time = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /* --- CLASE FLOR PROFESIONAL --- */
    class Flower {
      constructor(x, y) {
        this.x = x;
        this.y = window.innerHeight;
        this.targetY = y;
        this.stemHeight = 0;
        this.maxStemHeight = window.innerHeight - y;
        this.petalProgress = 0;
        this.maxPetalSize = Math.random() * 22 + 25;
        this.petalCount = Math.floor(Math.random() * 3) * 2 + 8; // 8, 10 o 12 pétalos
        
        // Paletas de color románticas con gradiente
        const colors = [
          { inner: '#f43f5e', outer: '#fbcfe8' }, // Rosa intenso
          { inner: '#d946ef', outer: '#f5d0fe' }, // Violeta / Púrpura
          { inner: '#fbbf24', outer: '#fef3c7' }, // Amarillo primavera
          { inner: '#fb7185', outer: '#ffe4e6' }, // Coral suave
          { inner: '#38bdf8', outer: '#e0f2fe' }  // Azul cielo
        ];
        this.palette = colors[Math.floor(Math.random() * colors.length)];
        this.growthSpeed = Math.random() * 3 + 3;
        this.swayOffset = Math.random() * 100;
      }

      update() {
        if (this.stemHeight < this.maxStemHeight) {
          this.stemHeight += this.growthSpeed;
        } else if (this.petalProgress < 1) {
          this.petalProgress += 0.02;
        }
      }

      draw() {
        // Balanceo natural del viento
        const sway = Math.sin(time * 0.002 + this.swayOffset) * 12 * (this.stemHeight / this.maxStemHeight);
        const flowerHeadX = this.x + sway;
        const currentY = window.innerHeight - this.stemHeight;

        // Tallo con gradiente y curva suave
        const stemGrad = ctx.createLinearGradient(this.x, window.innerHeight, flowerHeadX, currentY);
        stemGrad.addColorStop(0, '#15803d');
        stemGrad.addColorStop(1, '#4ade80');

        ctx.beginPath();
        ctx.moveTo(this.x, window.innerHeight);
        ctx.quadraticCurveTo(this.x + sway * 0.5, window.innerHeight - this.stemHeight * 0.5, flowerHeadX, currentY);
        ctx.strokeStyle = stemGrad;
        ctx.lineWidth = 5;
        ctx.stroke();

        // Hojas en el tallo
        if (this.stemHeight > this.maxStemHeight * 0.5) {
          ctx.save();
          ctx.translate(this.x + sway * 0.3, window.innerHeight - this.stemHeight * 0.4);
          ctx.rotate(0.3);
          ctx.beginPath();
          ctx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#22c55e';
          ctx.fill();
          ctx.restore();
        }

        // Cabeza de la Flor (Pétalos con sombras y gradientes)
        if (this.petalProgress > 0) {
          ctx.save();
          ctx.translate(flowerHeadX, currentY);
          
          const currentPetalSize = this.maxPetalSize * this.petalProgress;

          for (let i = 0; i < this.petalCount; i++) {
            const angle = (Math.PI * 2 / this.petalCount) * i;
            ctx.save();
            ctx.rotate(angle);

            // Gradiente para cada pétalo
            const petalGrad = ctx.createRadialGradient(0, 0, 0, 0, currentPetalSize, currentPetalSize);
            petalGrad.addColorStop(0, this.palette.inner);
            petalGrad.addColorStop(1, this.palette.outer);

            ctx.beginPath();
            ctx.ellipse(0, currentPetalSize * 0.7, currentPetalSize * 0.35, currentPetalSize * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = petalGrad;
            ctx.shadowColor = 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
          }

          // Centro con polen detallado
          const centerGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, currentPetalSize * 0.35);
          centerGrad.addColorStop(0, '#fef08a');
          centerGrad.addColorStop(1, '#ca8a04');

          ctx.beginPath();
          ctx.arc(0, 0, currentPetalSize * 0.35, 0, Math.PI * 2);
          ctx.fillStyle = centerGrad;
          ctx.fill();
          ctx.restore();
        }
      }
    }

    /* --- CLASE MARIPOSA ANIMADA --- */
    class Butterfly {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * (canvas.height * 0.6);
        this.size = Math.random() * 6 + 10;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.wingAngle = 0;
        this.wingSpeed = Math.random() * 0.15 + 0.1;
        this.color = ['#f472b6', '#38bdf8', '#fbbf24', '#c084fc'][Math.floor(Math.random() * 4)];
      }

      update() {
        this.x += this.vx + Math.sin(time * 0.003);
        this.y += this.vy + Math.cos(time * 0.003);
        this.wingAngle += this.wingSpeed;

        if (this.x < -20) this.x = canvas.width + 20;
        if (this.x > canvas.width + 20) this.x = -20;
        if (this.y < -20) this.y = canvas.height * 0.7;
        if (this.y > canvas.height * 0.7) this.y = 50;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const wingScale = Math.abs(Math.sin(this.wingAngle));

        // Ala izquierda
        ctx.save();
        ctx.scale(wingScale, 1);
        ctx.beginPath();
        ctx.ellipse(-this.size * 0.8, -this.size * 0.5, this.size * 0.9, this.size * 0.6, Math.PI / 4, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();

        // Ala derecha
        ctx.save();
        ctx.scale(wingScale, 1);
        ctx.beginPath();
        ctx.ellipse(this.size * 0.8, -this.size * 0.5, this.size * 0.9, this.size * 0.6, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();

        // Cuerpo
        ctx.beginPath();
        ctx.ellipse(0, 0, 2, this.size * 0.8, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.restore();
      }
    }

    /* --- CLASE PÉTALOS Y DESTELLOS --- */
    class Petal {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = -20;
        this.size = Math.random() * 8 + 6;
        this.speedY = Math.random() * 1.5 + 1;
        this.speedX = Math.random() * 1.5 - 0.75;
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 0.03 - 0.015;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(time * 0.002);
        this.rotation += this.rotSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(251, 113, 133, 0.85)';
        ctx.fill();
        ctx.restore();
      }
    }

    class Sparkle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }

      update() {
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#fef08a';
        ctx.shadowColor = '#fef08a';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }
    }

    /* --- BUCLE DE ANIMACIÓN PRINCIPAL --- */
    function animate(timestamp) {
      time = timestamp || 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar elementos en orden
      flowers.forEach(f => { f.update(); f.draw(); });
      butterflies.forEach(b => { b.update(); b.draw(); });

      petals.forEach((p, idx) => {
        p.update();
        p.draw();
        if (p.y > canvas.height + 20) petals.splice(idx, 1);
      });

      sparkles.forEach((s, idx) => {
        s.update();
        s.draw();
        if (s.alpha <= 0) sparkles.splice(idx, 1);
      });

      requestAnimationFrame(animate);
    }
    animate();

    /* --- INTERACCIONES --- */
    function spawnGarden() {
      flowers = [];
      const count = Math.floor(window.innerWidth / 130);
      for (let i = 0; i < count; i++) {
        const x = (canvas.width / count) * i + Math.random() * 40 + 20;
        const y = canvas.height - (Math.random() * 220 + 160);
        flowers.push(new Flower(x, y));
      }

      butterflies = [];
      for (let i = 0; i < 5; i++) {
        butterflies.push(new Butterfly());
      }
    }

    canvas.addEventListener('click', (e) => {
      flowers.push(new Flower(e.clientX, e.clientY));
      for (let i = 0; i < 8; i++) {
        sparkles.push(new Sparkle(e.clientX + (Math.random() - 0.5) * 40, e.clientY + (Math.random() - 0.5) * 40));
      }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('intro-overlay').classList.add('hidden');
      spawnGarden();
      
      // Reproducción de audio MP3
      bgMusic.play().then(() => {
        isPlayingMusic = true;
        document.getElementById('music-btn').innerText = '🎵 Música On';
      }).catch(err => {
        console.log("Audio autostart bloqueado:", err);
      });
    });

    document.getElementById('music-btn').addEventListener('click', () => {
      if (isPlayingMusic) {
        bgMusic.pause();
        document.getElementById('music-btn').innerText = '🔇 Música Off';
      } else {
        bgMusic.play();
        document.getElementById('music-btn').innerText = '🎵 Música On';
      }
      isPlayingMusic = !isPlayingMusic;
    });

    document.getElementById('petals-btn').addEventListener('click', () => {
      for (let i = 0; i < 40; i++) {
        petals.push(new Petal());
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      flowers = [];
      butterflies = [];
    });

    /* MODAL DE EDICIÓN */
    const modal = document.getElementById('modal-overlay');
    document.getElementById('edit-btn').addEventListener('click', () => {
      modal.classList.remove('modal-hidden');
    });

    document.getElementById('cancel-btn').addEventListener('click', () => {
      modal.classList.add('modal-hidden');
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const newTitle = document.getElementById('input-title').value;
      const newMessage = document.getElementById('input-message').value;

      if (newTitle) document.getElementById('title-text').innerText = newTitle;
      if (newMessage) document.getElementById('message-text').innerText = newMessage;

      modal.classList.add('modal-hidden');
    });
  </script>
</body>
</html>
